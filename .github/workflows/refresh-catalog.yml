name: Refresh catalog

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits non-zero, leaving the committed catalog untouched, if either upstream
      # changed its schema or the catalog would shrink by more than half.
      - name: Import and geocode
        run: npm run import

      - name: Self-test
        run: npm test

      - name: Commit if changed
        run: |
          git config user.name "atlas-eye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/upstream
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
          else
            git commit -m "Refresh stream catalog ($(date -u +%Y-%m-%d))"
            git push
          fi
